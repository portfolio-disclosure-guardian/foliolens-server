services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: evaluation
      FOLIOLENS_DATASET_VERSION: ${FOLIOLENS_DATASET_VERSION:?FOLIOLENS_DATASET_VERSION is required}
      FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP: "false"
      FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP: "false"
      FOLIOLENS_IMPORT_DOCUMENTS_ON_STARTUP: "false"
      FOLIOLENS_PROFILE_XML_STRUCTURE_ON_STARTUP: "false"
      FOLIOLENS_PROFILE_XML_BATCH_ON_STARTUP: "false"
      FOLIOLENS_PROFILE_HTML_BATCH_ON_STARTUP: "false"
      FOLIOLENS_VALIDATE_XML_PARSING_ON_STARTUP: "false"
      FOLIOLENS_VALIDATE_HTML_PARSING_ON_STARTUP: "false"
      FOLIOLENS_PERSIST_XML_PARSING_ON_STARTUP: "false"
      FOLIOLENS_PERSIST_HTML_PARSING_ON_STARTUP: "false"
      FOLIOLENS_PERSIST_PDF_PARSING_ON_STARTUP: "false"
      FOLIOLENS_CHUNKING_ON_STARTUP: "false"
      FOLIOLENS_REQUIRE_APPROVED_GOLDEN_CASE: "true"
      FOLIOLENS_ANSWER_DEADLINE_MS: ${FOLIOLENS_ANSWER_DEADLINE_MS:-30000}
      HCX_API_ENABLED: "true"
      HCX_API_KEY: ${HCX_API_KEY:?HCX_API_KEY is required}
      HCX_MODEL: ${HCX_MODEL:?HCX_MODEL is required}
      HCX_APP_TYPE: ${HCX_APP_TYPE:?HCX_APP_TYPE is required}
      HCX_CONNECT_TIMEOUT_MS: ${HCX_CONNECT_TIMEOUT_MS:-3000}
      HCX_READ_TIMEOUT_MS: ${HCX_READ_TIMEOUT_MS:-30000}
      HCX_MAX_TOKENS: ${HCX_MAX_TOKENS:-1024}
      HCX_TEMPERATURE: ${HCX_TEMPERATURE:-0.5}
      HCX_TOP_P: ${HCX_TOP_P:-0.8}

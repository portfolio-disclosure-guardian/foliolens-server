name: foliolens

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foliolens}
      POSTGRES_USER: ${POSTGRES_USER:-foliolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-foliolens}
      DB_USERNAME: ${POSTGRES_USER:-foliolens}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      FOLIOLENS_DATASET_ROOT: /data
      FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP: ${FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP:-false}
      FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP: ${FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP:-false}
      FOLIOLENS_IMPORT_DOCUMENTS_ON_STARTUP: ${FOLIOLENS_IMPORT_DOCUMENTS_ON_STARTUP:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${FOLIOLENS_DATASET_PATH:-../foliolens-data}
        target: /data
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:

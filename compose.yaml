name: foliolens

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foliolens}
      POSTGRES_USER: ${POSTGRES_USER:-foliolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-foliolens}
      DB_USERNAME: ${POSTGRES_USER:-foliolens}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      FOLIOLENS_DATASET_ROOT: /data
      FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP: ${FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP:-false}
      FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP: ${FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP:-false}
      FOLIOLENS_IMPORT_DOCUMENTS_ON_STARTUP: ${FOLIOLENS_IMPORT_DOCUMENTS_ON_STARTUP:-false}

      FOLIOLENS_PROFILE_XML_STRUCTURE_ON_STARTUP: ${FOLIOLENS_PROFILE_XML_STRUCTURE_ON_STARTUP:-false}
      FOLIOLENS_PROFILE_XML_RECEIPT_NO: ${FOLIOLENS_PROFILE_XML_RECEIPT_NO:-}
      FOLIOLENS_PROFILE_XML_FILE_NAME: ${FOLIOLENS_PROFILE_XML_FILE_NAME:-}
      FOLIOLENS_PROFILE_XML_BATCH_ON_STARTUP: ${FOLIOLENS_PROFILE_XML_BATCH_ON_STARTUP:-false}
      FOLIOLENS_PROFILE_XML_BATCH_PAGE: ${FOLIOLENS_PROFILE_XML_BATCH_PAGE:-0}
      FOLIOLENS_PROFILE_XML_BATCH_LIMIT: ${FOLIOLENS_PROFILE_XML_BATCH_LIMIT:-50}
      FOLIOLENS_PROFILE_XML_BATCH_REPORT_PATH: /reports/${FOLIOLENS_PROFILE_XML_BATCH_REPORT_FILE_NAME:-xml-structure-profile.csv}

      FOLIOLENS_PROFILE_HTML_BATCH_ON_STARTUP: ${FOLIOLENS_PROFILE_HTML_BATCH_ON_STARTUP:-false}
      FOLIOLENS_PROFILE_HTML_BATCH_PAGE: ${FOLIOLENS_PROFILE_HTML_BATCH_PAGE:-0}
      FOLIOLENS_PROFILE_HTML_BATCH_LIMIT: ${FOLIOLENS_PROFILE_HTML_BATCH_LIMIT:-50}
      # '-'를 사용해 명시적인 빈 값은 보존한다. 빈 값이면 전체 HTML 대상이다.
      FOLIOLENS_PROFILE_HTML_BATCH_RAW_SUBTYPE: ${FOLIOLENS_PROFILE_HTML_BATCH_RAW_SUBTYPE-신규시설투자등}
      FOLIOLENS_PROFILE_HTML_BATCH_REPORT_PATH: /reports/${FOLIOLENS_PROFILE_HTML_BATCH_REPORT_FILE_NAME:-html-structure-profile.csv}

      FOLIOLENS_VALIDATE_XML_PARSING_ON_STARTUP: ${FOLIOLENS_VALIDATE_XML_PARSING_ON_STARTUP:-false}
      FOLIOLENS_VALIDATE_HTML_PARSING_ON_STARTUP: ${FOLIOLENS_VALIDATE_HTML_PARSING_ON_STARTUP:-false}
      FOLIOLENS_VALIDATE_HTML_PARSING_PAGE: ${FOLIOLENS_VALIDATE_HTML_PARSING_PAGE:-0}
      FOLIOLENS_VALIDATE_HTML_PARSING_LIMIT: ${FOLIOLENS_VALIDATE_HTML_PARSING_LIMIT:-50}
      FOLIOLENS_VALIDATE_HTML_PARSING_EXPECTED_COUNT: ${FOLIOLENS_VALIDATE_HTML_PARSING_EXPECTED_COUNT:-43}
      FOLIOLENS_VALIDATE_HTML_PARSING_RAW_SUBTYPE: ${FOLIOLENS_VALIDATE_HTML_PARSING_RAW_SUBTYPE:-신규시설투자등}
      FOLIOLENS_VALIDATE_HTML_PARSING_REPORT_PATH: /reports/${FOLIOLENS_VALIDATE_HTML_PARSING_REPORT_FILE_NAME:-html-parsing-validation.csv}
      FOLIOLENS_PERSIST_HTML_PARSING_ON_STARTUP: ${FOLIOLENS_PERSIST_HTML_PARSING_ON_STARTUP:-false}
      FOLIOLENS_PERSIST_HTML_PARSING_BATCH_SIZE: ${FOLIOLENS_PERSIST_HTML_PARSING_BATCH_SIZE:-10}
      FOLIOLENS_PERSIST_HTML_PARSING_MAX_DOCUMENTS: ${FOLIOLENS_PERSIST_HTML_PARSING_MAX_DOCUMENTS:-43}
      FOLIOLENS_PERSIST_HTML_PARSING_MAX_FAILURES: ${FOLIOLENS_PERSIST_HTML_PARSING_MAX_FAILURES:-5}
      FOLIOLENS_PERSIST_HTML_PARSING_RAW_SUBTYPE: ${FOLIOLENS_PERSIST_HTML_PARSING_RAW_SUBTYPE:-신규시설투자등}
      FOLIOLENS_VALIDATE_XML_PARSING_PAGE: ${FOLIOLENS_VALIDATE_XML_PARSING_PAGE:-0}
      FOLIOLENS_VALIDATE_XML_PARSING_LIMIT: ${FOLIOLENS_VALIDATE_XML_PARSING_LIMIT:-50}
      FOLIOLENS_VALIDATE_XML_PARSING_REPORT_PATH: /reports/${FOLIOLENS_VALIDATE_XML_PARSING_REPORT_FILE_NAME:-xml-parsing-validation.csv}
      FOLIOLENS_PERSIST_XML_PARSING_ON_STARTUP: ${FOLIOLENS_PERSIST_XML_PARSING_ON_STARTUP:-false}
      FOLIOLENS_PERSIST_XML_PARSING_LIMIT: ${FOLIOLENS_PERSIST_XML_PARSING_LIMIT:-50}
      FOLIOLENS_PERSIST_XML_PARSING_MAX_DOCUMENTS: ${FOLIOLENS_PERSIST_XML_PARSING_MAX_DOCUMENTS:-500}
      FOLIOLENS_PERSIST_XML_PARSING_MAX_FAILURES: ${FOLIOLENS_PERSIST_XML_PARSING_MAX_FAILURES:-10}

      FOLIOLENS_CHUNKING_ON_STARTUP: ${FOLIOLENS_CHUNKING_ON_STARTUP:-false}
      FOLIOLENS_PERSIST_PDF_PARSING_ON_STARTUP: ${FOLIOLENS_PERSIST_PDF_PARSING_ON_STARTUP:-false}
      FOLIOLENS_PERSIST_PDF_PARSING_MAX_DOCUMENTS: ${FOLIOLENS_PERSIST_PDF_PARSING_MAX_DOCUMENTS:-3}
      FOLIOLENS_CHUNKING_CONTENT_FORMAT: ${FOLIOLENS_CHUNKING_CONTENT_FORMAT:-DART_XML}
      FOLIOLENS_CHUNKING_RAW_SUBTYPE: ${FOLIOLENS_CHUNKING_RAW_SUBTYPE:-}
      FOLIOLENS_CHUNKING_BATCH_SIZE: ${FOLIOLENS_CHUNKING_BATCH_SIZE:-10}
      FOLIOLENS_CHUNKING_MAX_DOCUMENTS: ${FOLIOLENS_CHUNKING_MAX_DOCUMENTS:-50}
      FOLIOLENS_CHUNKING_MAX_FAILURES: ${FOLIOLENS_CHUNKING_MAX_FAILURES:-5}

      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${FOLIOLENS_DATASET_PATH:-../foliolens-data}
        target: /data
        read_only: true
      - type: bind
        source: ${FOLIOLENS_PROFILE_REPORT_DIRECTORY:-./reports}
        target: /reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:

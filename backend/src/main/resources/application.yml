spring:
  application:
    name: foliolens

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foliolens}
    username: ${DB_USERNAME:foliolens}
    password: ${DB_PASSWORD:change-this-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${JPA_BATCH_SIZE:500}
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

foliolens:
  dataset:
    root: ${FOLIOLENS_DATASET_ROOT:../foliolens-data}
    version: ${FOLIOLENS_DATASET_VERSION:contest-2026q1-v1}
    market-cap-as-of: ${FOLIOLENS_MARKET_CAP_AS_OF:2026-07-24}
    import-companies-on-startup: ${FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP:false}
    import-disclosures-on-startup: ${FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP:false}
    import-documents-on-startup: ${FOLIOLENS_IMPORT_DOCUMENTS_ON_STARTUP:false}

  profiling:
    xml-structure:
      enabled: ${FOLIOLENS_PROFILE_XML_STRUCTURE_ON_STARTUP:false}
      receipt-no: ${FOLIOLENS_PROFILE_XML_RECEIPT_NO:}
      file-name: ${FOLIOLENS_PROFILE_XML_FILE_NAME:}
      batch:
        enabled: ${FOLIOLENS_PROFILE_XML_BATCH_ON_STARTUP:false}
        page: ${FOLIOLENS_PROFILE_XML_BATCH_PAGE:0}
        limit: ${FOLIOLENS_PROFILE_XML_BATCH_LIMIT:50}
        report-path: ${FOLIOLENS_PROFILE_XML_BATCH_REPORT_PATH:./reports/xml-structure-profile.csv}

    html-structure:
      batch:
        enabled: ${FOLIOLENS_PROFILE_HTML_BATCH_ON_STARTUP:false}
        page: ${FOLIOLENS_PROFILE_HTML_BATCH_PAGE:0}
        limit: ${FOLIOLENS_PROFILE_HTML_BATCH_LIMIT:50}
        # 빈 문자열이면 모든 HTML 문서를 조사한다.
        raw-subtype: ${FOLIOLENS_PROFILE_HTML_BATCH_RAW_SUBTYPE:신규시설투자등}
        report-path: ${FOLIOLENS_PROFILE_HTML_BATCH_REPORT_PATH:./reports/html-structure-profile.csv}

  validation:
    html-parsing:
      batch:
        enabled: ${FOLIOLENS_VALIDATE_HTML_PARSING_ON_STARTUP:false}
        page: ${FOLIOLENS_VALIDATE_HTML_PARSING_PAGE:0}
        limit: ${FOLIOLENS_VALIDATE_HTML_PARSING_LIMIT:50}
        expected-count: ${FOLIOLENS_VALIDATE_HTML_PARSING_EXPECTED_COUNT:43}
        raw-subtype: ${FOLIOLENS_VALIDATE_HTML_PARSING_RAW_SUBTYPE:신규시설투자등}
        report-path: ${FOLIOLENS_VALIDATE_HTML_PARSING_REPORT_PATH:./reports/html-parsing-validation.csv}
    xml-parsing:
      batch:
        enabled: ${FOLIOLENS_VALIDATE_XML_PARSING_ON_STARTUP:false}
        page: ${FOLIOLENS_VALIDATE_XML_PARSING_PAGE:0}
        limit: ${FOLIOLENS_VALIDATE_XML_PARSING_LIMIT:50}
        report-path: ${FOLIOLENS_VALIDATE_XML_PARSING_REPORT_PATH:./reports/xml-parsing-validation.csv}

  parsing:
    html-persistence:
      batch:
        enabled: ${FOLIOLENS_PERSIST_HTML_PARSING_ON_STARTUP:false}
        batch-size: ${FOLIOLENS_PERSIST_HTML_PARSING_BATCH_SIZE:10}
        max-documents: ${FOLIOLENS_PERSIST_HTML_PARSING_MAX_DOCUMENTS:43}
        max-failures: ${FOLIOLENS_PERSIST_HTML_PARSING_MAX_FAILURES:5}
        raw-subtype: ${FOLIOLENS_PERSIST_HTML_PARSING_RAW_SUBTYPE:신규시설투자등}
    xml-persistence:
      batch:
        enabled: ${FOLIOLENS_PERSIST_XML_PARSING_ON_STARTUP:false}
        chunk-size: ${FOLIOLENS_PERSIST_XML_PARSING_LIMIT:50}
        max-documents: ${FOLIOLENS_PERSIST_XML_PARSING_MAX_DOCUMENTS:500}
        max-failures: ${FOLIOLENS_PERSIST_XML_PARSING_MAX_FAILURES:10}

  chunking:
    batch:
      enabled: ${FOLIOLENS_CHUNKING_ON_STARTUP:false}
      content-format: ${FOLIOLENS_CHUNKING_CONTENT_FORMAT:DART_XML}
      raw-subtype: ${FOLIOLENS_CHUNKING_RAW_SUBTYPE:}
      batch-size: ${FOLIOLENS_CHUNKING_BATCH_SIZE:10}
      max-documents: ${FOLIOLENS_CHUNKING_MAX_DOCUMENTS:50}
      max-failures: ${FOLIOLENS_CHUNKING_MAX_FAILURES:5}

  question:
    answer:
      require-approved-golden-case: ${FOLIOLENS_REQUIRE_APPROVED_GOLDEN_CASE:false}
      deadline-ms: ${FOLIOLENS_ANSWER_DEADLINE_MS:30000}
    plan:
      search-disclosures:
        # TOOL_CONTRACTS.md 5.1절 예시값. ROLE_A_SPEC.md 9.1절 DECISION_REQUIRED — 골든셋 측정 후 확정
        limit-min: ${FOLIOLENS_PLAN_SEARCH_DISCLOSURES_LIMIT_MIN:1}
        limit-max: ${FOLIOLENS_PLAN_SEARCH_DISCLOSURES_LIMIT_MAX:50}
hcx:
  api:
    base-url: ${HCX_API_BASE_URL:https://api.hcx.com}
    client-id: ${HCX_API_CLIENT_ID:change-this-client-id}
    client-secret: ${HCX_API_CLIENT_SECRET:change-this-client-secret}
    token:
    url: ${HCX_API_TOKEN_URL:https://api.hcx.com/oauth/token}
    grant-type: client_credentials No newline at end of file
    enabled: ${HCX_API_ENABLED:false}          # false면 Fake 유지
    base-url: ${HCX_API_BASE_URL:https://clovastudio.stream.ntruss.com}
    api-key: ${HCX_API_KEY:}
    model: ${HCX_MODEL:HCX-005}
    # 테스트 키는 testapp, 대회 제출용 서비스 키로 교체하면 serviceapp으로 바꾼다.
    app-type: ${HCX_APP_TYPE:testapp}
    connect-timeout-ms: ${HCX_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${HCX_READ_TIMEOUT_MS:30000}
    max-tokens: ${HCX_MAX_TOKENS:1024}
    temperature: ${HCX_TEMPERATURE:0.5}
    top-p: ${HCX_TOP_P:0.8}

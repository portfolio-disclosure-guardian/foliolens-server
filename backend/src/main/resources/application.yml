spring:
  application:
    name: foliolens

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foliolens}
    username: ${DB_USERNAME:foliolens}
    password: ${DB_PASSWORD:change-this-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

foliolens:
  dataset:
    root: ${FOLIOLENS_DATASET_ROOT:../foliolens-data}
    version: ${FOLIOLENS_DATASET_VERSION:contest-2026q1-v1}
    market-cap-as-of: ${FOLIOLENS_MARKET_CAP_AS_OF:2026-07-24}
    import-companies-on-startup: ${FOLIOLENS_IMPORT_COMPANIES_ON_STARTUP:false}
    import-disclosures-on-startup: ${FOLIOLENS_IMPORT_DISCLOSURES_ON_STARTUP:false}
